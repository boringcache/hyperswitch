workspace = "boringcache/hyperswitch"

[proxy]
metadata-hints = ["project=hyperswitch", "issue=14195", "workflow=ci-pr", "lane=stable-v1"]

[entries.cargo-registry-cache]
tag = "hyperswitch-stable-v1-registry-cache"

[entries.cargo-registry-index]
tag = "hyperswitch-stable-v1-registry-index"

[entries.cargo-git-db]
tag = "hyperswitch-stable-v1-git-db"

[entries.cargo-target]
kind = "cargo-target"
tag = "hyperswitch-stable-v1-target"

[profiles.cargo]
entries = ["cargo-registry-cache", "cargo-registry-index", "cargo-git-db", "cargo-target"]

[adapters.cargo]
tag = "hyperswitch-stable-v1-cargo"
profiles = ["cargo"]
command = ["cargo", "check", "--features", "release"]
compiler-cache = "none"
fail-on-cache-error = true
