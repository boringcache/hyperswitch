workspace = "boringcache/hyperswitch"

[proxy]
metadata-hints = ["project=hyperswitch", "issue=14195", "workflow=ci-push", "lane=msrv"]

[entries.cargo-registry-cache]
tag = "hyperswitch-validation-v2-msrv-registry-cache"

[entries.cargo-registry-index]
tag = "hyperswitch-validation-v2-msrv-registry-index"

[entries.cargo-git-db]
tag = "hyperswitch-validation-v2-msrv-git-db"

[entries.cargo-target]
kind = "cargo-target"
tag = "hyperswitch-validation-v2-msrv-target"

[profiles.cargo]
entries = ["cargo-registry-cache", "cargo-registry-index", "cargo-git-db", "cargo-target"]

[adapters.cargo]
tag = "hyperswitch-validation-v2-msrv-cargo"
profiles = ["cargo"]
command = ["cargo", "check", "--features", "release"]
compiler-cache = "none"
save-on-failure = true
fail-on-cache-error = true
