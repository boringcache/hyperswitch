name: BoringCache validation — Hyperswitch MSRV sccache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boringcache-hyperswitch-validation
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"

jobs:
  publish:
    name: Publish MSRV compiler cache
    if: github.repository == 'boringcache/hyperswitch' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          make-default: true

      - name: Get rust version from Cargo.toml
        run: |
          rust_version=$(yq -oy '.workspace.package.rust-version' Cargo.toml)
          echo "rust_version=${rust_version}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "${{ env.rust_version }}"

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure BoringCache sccache publishing
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          trust-policy: publish
          mode: sccache
          diagnostics: summary
          fail-on-cache-error: true

      - name: Check compilation on the MSRV toolchain
        run: cargo check --features "release"

      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats

  restore:
    name: Restore MSRV compiler cache on a clean runner
    needs: publish
    if: github.repository == 'boringcache/hyperswitch' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          make-default: true

      - name: Get rust version from Cargo.toml
        run: |
          rust_version=$(yq -oy '.workspace.package.rust-version' Cargo.toml)
          echo "rust_version=${rust_version}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "${{ env.rust_version }}"

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure read-only BoringCache sccache
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          trust-policy: restore
          mode: sccache
          diagnostics: summary
          fail-on-cache-error: true

      - name: Check compilation on the MSRV toolchain
        run: cargo check --features "release"

      - name: Report sccache statistics
        if: always()
        run: sccache --show-stats
