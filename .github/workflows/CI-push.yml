  test:
    name: Run tests on stable toolchain
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-24.04-arm' || 'hyperswitch-runners-merge' }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write

    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust cache
        if: github.event_name != 'workflow_dispatch' || inputs.cache_provider == 'github'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: stable-v1
          save-if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true

      - name: Install cargo-hack
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-hack
          checksum: true

      - name: Install just
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: just
          checksum: true

      - name: Install jq
        shell: bash
        run: .github/scripts/install-jq.sh

      # - name: Install cargo-nextest
      #   uses: taiki-e/install-action@v2
      #   with:
      #     tool: cargo-nextest
      #     checksum: true

      - name: Checkout the BoringCache stable-v1 publisher plan
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: boringcache-validation
          path: .boringcache-validation-plan
          sparse-checkout: .github/boringcache-plans/push-stable-v1/.boringcache.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select the BoringCache stable-v1 publisher plan
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        run: cp .boringcache-validation-plan/.github/boringcache-plans/push-stable-v1/.boringcache.toml .boringcache.toml

      - name: Run clippy (redis-rs backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: just clippy

      - name: Run clippy (fred backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: just clippy fred

      - name: Cargo hack
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: just ci_hack

      - name: Finalize GitHub Cargo state
        if: always() && github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'github'
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo check --features "release"

      - name: Finalize BoringCache Cargo state
        id: boringcache
        if: always() && github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        env:
          CARGO_BUILD_JOBS: 2
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          mode: cargo
          trust-policy: publish
          diagnostics: summary
          fail-on-cache-error: true

      - name: Retain BoringCache evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyperswitch-push-stable-v1-${{ inputs.source_ref }}
          path: ${{ steps.boringcache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30

      - name: Cargo build release
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo check --features "release"

  typos:
    name: Spell check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: crate-ci/typos@master

  typos-required:
    name: Spell check specific critical directories
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check specific directories
        uses: crate-ci/typos@v1.48.0
        with:
          files: |
            api-reference/
            crates/api_models/
            crates/common_utils/
            crates/common_enums/
            crates/diesel_models/
            migrations/
            v2_migrations/
            v2_compatible_migrations/
            config/
            docs/

  check-v2:
    name: Check compilation for V2 features
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-24.04-arm' || 'hyperswitch-runners-merge' }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable 2 weeks ago

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust cache
        if: github.event_name != 'workflow_dispatch' || inputs.cache_provider == 'github'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: stable-v2
          save-if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true

      - name: Checkout the BoringCache stable-v2 publisher plan
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: boringcache-validation
          path: .boringcache-validation-plan
          sparse-checkout: .github/boringcache-plans/push-stable-v2/.boringcache.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select the BoringCache stable-v2 publisher plan
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        run: cp .boringcache-validation-plan/.github/boringcache-plans/push-stable-v2/.boringcache.toml .boringcache.toml

      - name: Run cargo check enabling only the release and v2 features (redis-rs backend)
        shell: bash
        run: cargo check --no-default-features --features "release,v2,redis-rs"

      - name: Run cargo check enabling only the release and v2 features (fred backend)
        if: github.event_name != 'workflow_dispatch' || inputs.cache_provider == 'github'
        shell: bash
        run: cargo check --no-default-features --features "release,v2,fred"

      - name: Run stable-v2 checks with BoringCache
        id: boringcache
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          mode: cargo
          trust-policy: publish
          diagnostics: summary
          fail-on-cache-error: true

      - name: Retain BoringCache evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyperswitch-push-stable-v2-${{ inputs.source_ref }}
          path: ${{ steps.boringcache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30
