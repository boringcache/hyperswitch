name: CI-pr

permissions:
  contents: read

on:
  pull_request:

  workflow_dispatch:
    inputs:
      cache_provider:
        description: Cache implementation restored by the three Rust jobs from issue 14195
        type: choice
        options:
          - github
          - boringcache
        default: github
      source_ref:
        description: Exact Hyperswitch commit to build
        type: string
        required: true
        default: d8b6ebe773690aa37cf249b2992c2358dbd7f438

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.cache_provider || 'upstream' }}-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: true

env:
  # Disable incremental compilation.
  #
  # Incremental compilation is useful as part of an edit-build-test-edit cycle,
  # as it lets the compiler avoid recompiling code that hasn't changed. However,
  # on CI, we're not making small edits; we're almost always building the entire
  # project from scratch. Thus, incremental compilation on CI actually
  # introduces *additional* overhead to support making future builds
  # faster...but no future builds will ever occur in any given CI environment.
  #
  # See https://matklad.github.io/2021/09/04/fast-rust-builds.html#ci-workflow
  # for details.
  CARGO_INCREMENTAL: 0
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short

jobs:
  formatting:
    name: Check formatting
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
          private-key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository with token
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Checkout repository for fork
        if: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting for forked pull requests
        if: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: cargo +nightly fmt --all --check

      - name: Run formatter
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: |
          cargo +nightly fmt --all
          if ! git diff --exit-code --quiet -- crates; then
            echo "::notice::Formatting check failed"
            git config --local user.name 'hyperswitch-bot[bot]'
            git config --local user.email '148525504+hyperswitch-bot[bot]@users.noreply.github.com'
            git add crates
            git commit --message 'chore: run formatter'
            git push
          fi

  check-msrv:
    name: Check compilation on MSRV toolchain
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.pull_request.base.ref, 'hotfix-') }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write

    env:
      RUSTFLAGS: "-D warnings"

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Get rust version from Cargo.toml
        shell: bash
        run: |
          rust_version=$(yq -oy '.workspace.package.rust-version' Cargo.toml)
          echo "rust_version=${rust_version}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "${{ env.rust_version }}"

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust cache
        if: github.event_name != 'workflow_dispatch' || inputs.cache_provider == 'github'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: validation-v2-msrv
          save-if: false

      - name: Checkout the BoringCache MSRV restore plan
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: boringcache-validation
          path: .boringcache-validation-plan
          sparse-checkout: .github/boringcache-plans/pr-msrv/.boringcache.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select the BoringCache MSRV restore plan
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        run: |
          cp .boringcache-validation-plan/.github/boringcache-plans/pr-msrv/.boringcache.toml .boringcache.toml
          printf '%s\n' '/.boringcache.toml' '/.boringcache-validation-plan/' >> .git/info/exclude

      - name: Run cargo check
        if: github.event_name != 'workflow_dispatch' || inputs.cache_provider == 'github'
        shell: bash
        run: cargo check --features "release"

      - name: Run cargo check with BoringCache
        id: boringcache
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          mode: cargo
          trust-policy: restore
          diagnostics: summary
          fail-on-cache-error: true

      - name: Retain BoringCache evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyperswitch-pr-msrv-${{ inputs.source_ref }}
          path: ${{ steps.boringcache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30

  test:
    name: Run tests on stable toolchain
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-24.04-arm' || 'hyperswitch-runners' }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write

    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Generate a token
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
          private-key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository for fork
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
        uses: actions/checkout@v7

      - name: Checkout repository with token
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Checkout validation source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust cache
        if: github.event_name != 'workflow_dispatch' || inputs.cache_provider == 'github'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: validation-v2-stable-v1
          save-if: false

      - name: Install just
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: just
          checksum: true

      - name: Checkout the BoringCache stable-v1 restore plan
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: boringcache-validation
          path: .boringcache-validation-plan
          sparse-checkout: .github/boringcache-plans/pr-stable-v1/.boringcache.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select the BoringCache stable-v1 restore plan
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        run: |
          cp .boringcache-validation-plan/.github/boringcache-plans/pr-stable-v1/.boringcache.toml .boringcache.toml
          printf '%s\n' '/.boringcache.toml' '/.boringcache-validation-plan/' >> .git/info/exclude

      - name: Run cargo check
        if: github.event_name != 'workflow_dispatch' || inputs.cache_provider == 'github'
        shell: bash
        run: cargo check --features "release"

      - name: Restore BoringCache and run cargo check
        id: boringcache
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          mode: cargo
          trust-policy: restore
          diagnostics: summary
          fail-on-cache-error: true

      - name: Run clippy (redis-rs backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 3
        run: just clippy

      - name: Run clippy (fred backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 3
        run: just clippy fred

      - name: Check Cargo.lock changed
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: |
          if ! git diff --quiet --exit-code -- Cargo.lock ; then
            git config --local user.name 'hyperswitch-bot[bot]'
            git config --local user.email '148525504+hyperswitch-bot[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit --message 'chore: update Cargo.lock'
            git push
          fi

      - name: Retain BoringCache evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyperswitch-pr-stable-v1-${{ inputs.source_ref }}
          path: ${{ steps.boringcache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30

  typos:
    name: Spell check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: crate-ci/typos@master

  typos-required:
    name: Spell check specific critical directories
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check specific directories
        uses: crate-ci/typos@v1.48.0
        with:
          files: |
            api-reference/
            crates/api_models/
            crates/common_utils/
            crates/common_enums/
            crates/diesel_models/
            migrations/
            v2_migrations/
            v2_compatible_migrations/
            config/
            docs/

  check-v2:
    name: Check compilation for V2 features
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-24.04-arm' || 'hyperswitch-runners' }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust cache
        if: github.event_name != 'workflow_dispatch' || inputs.cache_provider == 'github'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: validation-v2-stable-v2
          save-if: false

      - name: Install just
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: just
          checksum: true

      - name: Checkout the BoringCache stable-v2 restore plan
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: boringcache-validation
          path: .boringcache-validation-plan
          sparse-checkout: .github/boringcache-plans/pr-stable-v2/.boringcache.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select the BoringCache stable-v2 restore plan
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        run: |
          cp .boringcache-validation-plan/.github/boringcache-plans/pr-stable-v2/.boringcache.toml .boringcache.toml
          printf '%s\n' '/.boringcache.toml' '/.boringcache-validation-plan/' >> .git/info/exclude

      - name: Run cargo check enabling only the release and v2 features (redis-rs backend)
        if: github.event_name != 'workflow_dispatch' || inputs.cache_provider == 'github'
        shell: bash
        env:
          RUSTFLAGS: "-A warnings"
        run: cargo check --no-default-features --features "release,v2,redis-rs"

      - name: Restore BoringCache and run cargo check (redis-rs backend)
        id: boringcache
        if: github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        env:
          RUSTFLAGS: "-A warnings"
        uses: boringcache/one@1039999c65011be670f5655e0e48ad556188ab12 # v1.30.4
        with:
          mode: cargo
          trust-policy: restore
          diagnostics: summary
          fail-on-cache-error: true

      - name: Run cargo clippy with v2 features enabled (redis-rs backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 3
        run: just clippy_v2

      - name: Run cargo clippy with v2 features enabled (fred backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 3
        run: just clippy_v2 fred

      - name: Run cargo check enabling only the release and v2 features (fred backend)
        shell: bash
        env:
          RUSTFLAGS: "-A warnings"
        run: cargo check --no-default-features --features "release,v2,fred"

      - name: Retain BoringCache evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.cache_provider == 'boringcache'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyperswitch-pr-stable-v2-${{ inputs.source_ref }}
          path: ${{ steps.boringcache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30
